<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111111" />
    <title>PRICETAX — Cronograma de Reforma Tributária</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-page: #111111;
        --bg-1: #141414;
        --bg-2: #161616;
        --bg-3: #181818;
        --bg-4: #1c1c1c;
        --border-1: #262626;
        --border-2: #2c2c2c;
        --border-3: #333333;
        --text-1: #eeeeee;
        --text-2: #dddddd;
        --text-3: #cccccc;
        --text-4: #a8a8a8;
        --text-5: #9c9c9c;
        --text-6: #929292;
        --text-7: #8a8a8a;
        --text-8: #6a6a6a;
        --scrollbar: #333333;
      }
      html[data-theme="light"] {
        --bg-page: #f4f3f0;
        --bg-1: #ffffff;
        --bg-2: #ffffff;
        --bg-3: #f1f0ec;
        --bg-4: #ede9e2;
        --border-1: #e2dfd7;
        --border-2: #d7d3c8;
        --border-3: #cbc6b9;
        --text-1: #262420;
        --text-2: #3a3833;
        --text-3: #45423c;
        --text-4: #55524b;
        --text-5: #615e57;
        --text-6: #636058;
        --text-7: #68655d;
        --text-8: #8a867b;
        --scrollbar: #d7d3c8;
      }
      /* Fonte base do app (2026-10-04): sem isto o body cai em Times e todo botão/campo em Arial — era o visual
         "anos 1980" de módulos que não declaravam fonte. Seletores de elemento (especificidade mínima): qualquer
         font-family de classe, inline ou de relatório impresso continua mandando. */
      body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
      button, input, select, textarea { font-family: inherit; }
      /* Contraste (WCAG AA 4.5:1) — medido em 2026-10-04: no tema claro 56% dos textos reprovavam, quase todos pelos
         cinzas --text-5/6/7. Valores acima já corrigidos nos dois temas. As cores de status abaixo são "texto neon
         sobre fundo claro" (verde 1,6:1, azul 2,6:1, amarelo 1,5:1): só no tema claro, só quando a cor é o TEXTO
         do elemento (border-color/background não casam com os seletores). !important porque a cor vem inline. */
      html[data-theme="light"] [style^="color: rgb(62, 207, 110)"], html[data-theme="light"] [style*="; color: rgb(62, 207, 110)"] { color: #176f39 !important; }
      html[data-theme="light"] [style^="color: rgb(91, 141, 239)"], html[data-theme="light"] [style*="; color: rgb(91, 141, 239)"] { color: #2b57b8 !important; }
      html[data-theme="light"] [style^="color: rgb(245, 196, 0)"], html[data-theme="light"] [style*="; color: rgb(245, 196, 0)"] { color: #7a5f00 !important; }
      html[data-theme="light"] [style^="color: rgb(226, 87, 76)"], html[data-theme="light"] [style*="; color: rgb(226, 87, 76)"] { color: #b3281d !important; }
      html[data-theme="light"] [style^="color: rgb(255, 159, 64)"], html[data-theme="light"] [style*="; color: rgb(255, 159, 64)"] { color: #9a4e00 !important; }
      html[data-theme="light"] [style^="color: rgb(155, 122, 245)"], html[data-theme="light"] [style*="; color: rgb(155, 122, 245)"] { color: #5b3dbf !important; }
      html[data-theme="light"] [style^="color: rgb(62, 166, 255)"], html[data-theme="light"] [style*="; color: rgb(62, 166, 255)"] { color: #14659f !important; }
      /* Foco: campos de texto trocavam só a cor da borda (amarelo sobre branco = 1,6:1); acrescenta um halo. Botões e
         links seguem com o anel padrão do navegador. */
      input:focus-visible, select:focus-visible, textarea:focus-visible { box-shadow: 0 0 0 3px rgba(245, 196, 0, .4); }
      html, body { background: var(--bg-page); }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      html, body { overflow-x: hidden; max-width: 100%; }
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }
      /* Alvos de toque (medido em 2026-10-04 a 375px): os botões de ícone da barra superior (início, tema, sair,
         notificações) tinham 23x23 px em TODAS as telas — abaixo do mínimo de 24 px do WCAG e longe dos 44 px
         recomendados. Só no celular; no desktop nada muda. Botão com `title` é, na prática, o botão de ícone. */
      @media (max-width: 767px) {
        button[title], a[title] { min-width: 36px; min-height: 36px; }
        button[title="Início"], button[title="Sair"], button[title^="Mudar para modo"], button[title="Notificações"] { min-width: 40px; min-height: 40px; }
      }
      /* Evita zoom automático do iOS ao focar campos (exige fonte >= 16px). Só em telas pequenas — desktop mantém o tamanho de fonte de cada componente. */
      @media (max-width: 767px) {
        input[type=text], input[type=email], input[type=password], input[type=number],
        input[type=date], input[type=tel], input[type=search], select, textarea {
          font-size: 16px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

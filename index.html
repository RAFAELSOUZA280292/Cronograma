<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111111" />
    <title>PRICETAX — Cronograma de Reforma Tributária</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-page: #111111;
        --bg-1: #141414;
        --bg-2: #161616;
        --bg-3: #181818;
        --bg-4: #1c1c1c;
        --border-1: #262626;
        --border-2: #2c2c2c;
        --border-3: #333333;
        --text-1: #eeeeee;
        --text-2: #dddddd;
        --text-3: #cccccc;
        --text-4: #999999;
        --text-5: #888888;
        --text-6: #777777;
        --text-7: #666666;
        --text-8: #555555;
        --scrollbar: #333333;
      }
      html[data-theme="light"] {
        --bg-page: #f4f3f0;
        --bg-1: #ffffff;
        --bg-2: #ffffff;
        --bg-3: #f1f0ec;
        --bg-4: #ede9e2;
        --border-1: #e2dfd7;
        --border-2: #d7d3c8;
        --border-3: #cbc6b9;
        --text-1: #262420;
        --text-2: #3a3833;
        --text-3: #504d46;
        --text-4: #6b6860;
        --text-5: #7d7a71;
        --text-6: #918e84;
        --text-7: #a19d92;
        --text-8: #b0ac9f;
        --scrollbar: #d7d3c8;
      }
      html, body { background: var(--bg-page); }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      html, body { overflow-x: hidden; max-width: 100%; }
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }
      /* Evita zoom automático do iOS ao focar campos (exige fonte >= 16px). Só em telas pequenas — desktop mantém o tamanho de fonte de cada componente. */
      @media (max-width: 767px) {
        input[type=text], input[type=email], input[type=password], input[type=number],
        input[type=date], input[type=tel], input[type=search], select, textarea {
          font-size: 16px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

# Verificação mínima a cada push na main e em pull requests (2026-10-30, Onda 1 / E1).
# Não bloqueia o deploy da Railway (que acompanha a main por conta própria): serve de alarme rápido, com o mesmo
# comando que roda localmente: `npm run build`, `npm run test:puro`, `npm run docs:conferir`.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:puro
      - run: npm run docs:conferir

  # Fluxos críticos de ponta a ponta (Onda 4, E2): Playwright + axe-core contra o servidor real, com Postgres de serviço e a RENATA roteirizada (sem IA).
  fluxos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cronograma_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
